[advisories]
version = 2
ignore = [
    # Both of these reach us ONLY through yara-x, and both advisories carry
    # `patched = []` — there is no version to upgrade to, so the first four
    # remediation options (patched release, maintained replacement, code fix,
    # restructure) are all unavailable. They are listed individually, with a
    # removal condition each, rather than inherited wholesale: this repo keeps
    # its own deny.toml precisely so a suppression has to be argued for.
    #
    # rsa 0.9.10 — Marvin Attack, key recovery through a timing sidechannel in
    # private-key DECRYPTION. Not reachable here, and that was checked rather
    # than assumed: yara-x's only rsa use is
    # src/modules/utils/crypto.rs, which imports `DecodePublicKey`,
    # `RsaPublicKey` and `Pkcs1v15Sign`, and calls `.verify(...)` for PE
    # authenticode signatures. `RsaPrivateKey`, `.decrypt(` and Oaep appear
    # nowhere in the crate's source. Unpatched upstream since 2023-11.
    # REMOVE WHEN: rsa ships a constant-time fix, or yara-x drops the dependency.
    # RE-CHECK the reachability claim above whenever yara-x is upgraded.
    "RUSTSEC-2023-0071",
    # bincode 2.0.1 — unmaintained. A maintenance-status advisory, not a
    # vulnerability: no known defect, and yara-x pins it for rule serialisation.
    # REMOVE WHEN: yara-x moves to a maintained serialiser.
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # libbz2-rs-sys (pure-Rust bzip2 port) carries the permissive BSD-style
    # bzip2/libbzip2 licence, reached via the 7z/tar.bz2 decode path.
    # Non-copyleft, same class as the entries above; archive-forensic and
    # usb-forensic allow it on the same reasoning.
    "bzip2-1.0.6",
    # webpki-roots ships Mozilla's CA bundle under CDLA-Permissive-2.0 — a
    # permissive data licence with no copyleft or attribution burden.
    "CDLA-Permissive-2.0",
    # ppmd-rust (PPMd decode, reached via sevenz-rust2 and via zip inside
    # yara-x) is "CC0-1.0 OR MIT-0". MIT-0 is OSI-approved and permissive with
    # no attribution burden, and satisfies the OR on its own — so CC0-1.0,
    # whose patent position some organisations avoid, stays off this list.
    "MIT-0",
]

# array-bytes declares `Apache-2.0/GPL-3.0`. The `/` is the deprecated spelling
# of OR, so this is a DUAL licence, not a GPL-only crate — we elect the
# Apache-2.0 arm, already allowed above. cargo-deny rejects it only because
# `GPL-3.0` is a deprecated identifier (`GPL-3.0-only` / `GPL-3.0-or-later` are
# current), so the election must be stated rather than inferred.
#
# Deliberately a per-crate clarification and NOT "GPL-3.0" in the allow-list:
# that would admit genuinely GPL-only crates, which for a distributed forensic
# binary is an obligation we are not taking on. This admits exactly one crate,
# on the arm we chose.
[[licenses.clarify]]
crate = "array-bytes"
expression = "Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
